<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>配置 - Config</title>
  <style>
    :root{ --bg:#f4f6fb; --card:#ffffff; --muted:#6b7280; --accent:#2563eb; --danger:#dc2626; --radius:12px; --shadow:0 6px 22px rgba(16,24,40,0.08); }
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);margin:0;color:#0f172a}
    .wrap{max-width:1000px;margin:28px auto;padding:20px}
    .header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    h1{margin:0;font-size:20px}
    p.lead{margin:6px 0 0;color:var(--muted);font-size:13px}
    .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
    .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    input[type=text]{padding:10px 12px;border-radius:10px;border:1px solid #e6eefc;min-width:180px}
    button.btn{background:var(--accent);color:#fff;border:none;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:600}
    button.btn.ghost{background:#fff;color:var(--accent);border:1px solid rgba(37,99,235,0.12)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
    .op-status{color:var(--muted);font-size:13px}
    .table-wrap{overflow:auto;border-radius:10px;border:1px solid #edf2fb;background:linear-gradient(180deg,#fff,#fbfdff)}
    table{width:100%;border-collapse:collapse;min-width:600px}
    thead th{position:sticky;top:0;background:#f8fafc;padding:10px;text-align:left;font-size:13px;color:#0b1220;border-bottom:1px solid #eef3fb}
    thead th.sortable{cursor:pointer}
    tbody td{padding:10px;border-top:1px solid #f1f5f9;font-size:14px;vertical-align:middle}
    tbody tr:nth-child(even){background:#fcfdff}
    .row-actions button{margin-left:6px;padding:6px 8px;border-radius:8px;border:none;cursor:pointer}
    .row-actions button.edit{background:#e6f0ff;color:var(--accent)}
    .row-actions button.del{background:#fff;border:1px solid #ffeced;color:var(--danger)}
    .empty{padding:24px;text-align:center;color:var(--muted)}
    .small{font-size:13px;color:var(--muted)}
    @media (max-width:900px){.toolbar{flex-direction:column;align-items:stretch;gap:8px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <h1>应用配置管理</h1>
        <p class="lead">查看、添加、更新或删除配置项。所有变更会以后端返回的最新数据刷新表格。</p>
      </div>
    </div>

    <div style="height:12px"></div>

    <div class="card">
      <div class="toolbar">
        <div style="display:flex;gap:8px;align-items:center">
          <label for="searchInput" class="sr-only">搜索</label>
          <input id="searchInput" type="text" placeholder="搜索 key 或 value" />
          <button id="addBtn" class="btn" title="添加配置">＋ 添加</button>
          <div class="small op-status" id="opStatus">未操作</div>
        </div>
        <div class="small">可通过表格右侧按钮快速编辑或删除</div>
      </div>

      <div class="table-wrap">
        <table id="configTable" aria-live="polite">
          <thead>
            <tr>
              <th class="sortable" data-key="key">Key ▲▼</th>
              <th>Value</th>
              <th style="width:140px">操作</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal (used for add and edit) -->
  <div id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);align-items:center;justify-content:center;z-index:9999">
    <div style="background:#fff;border-radius:10px;padding:18px;min-width:320px;max-width:90%;box-shadow:0 10px 30px rgba(2,6,23,0.2)">
      <div id="modalTitle" style="font-weight:700;margin-bottom:8px">编辑配置</div>
      <div style="margin-bottom:8px"><label for="modalKeyInput" style="font-size:13px;color:#556">Key</label><input id="modalKeyInput" type="text" style="width:100%;padding:8px;border-radius:8px;border:1px solid #eef3fb;background:#fff" /></div>
      <div style="margin-bottom:12px"><label for="modalValue" style="font-size:13px;color:#556">Value</label><input id="modalValue" type="text" style="width:100%;padding:8px;border-radius:8px;border:1px solid #eef3fb" /></div>
      <div style="margin-bottom:8px;color:#b91c1c;font-size:13px;min-height:18px" id="modalError"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
        <div>
          <button id="modalValidate" class="btn ghost" type="button">验证 JSON</button>
        </div>
        <div>
          <button id="modalCancel" class="btn ghost">取消</button>
          <button id="modalSave" class="btn">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status'); // may be undefined, keep harmless
    const opStatusEl = document.getElementById('opStatus');
    const table = document.getElementById('configTable');
    const tbody = table.querySelector('tbody');
    const addBtn = document.getElementById('addBtn');
    const searchInput = document.getElementById('searchInput');
    const thKey = table.querySelector('thead th[data-key="key"]');
    const editModal = document.getElementById('editModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalKeyInput = document.getElementById('modalKeyInput');
    const modalValueEl = document.getElementById('modalValue');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');
    const modalValidate = document.getElementById('modalValidate');
    const modalError = document.getElementById('modalError');

    let currentData = {};
    let sortAsc = true;
    let editingKey = null; // null => adding

    function setOp(msg){ if(opStatusEl) opStatusEl.textContent = msg || ''; }

    function renderConfig(data, filterText=''){
      currentData = data || {};
      const keys = Object.keys(currentData || {});
      if (keys.length === 0){
        if(statusEl) statusEl.textContent = '未找到配置项';
        tbody.innerHTML = '<tr><td colspan="3" class="empty">无配置</td></tr>';
        return;
      }
      const ft = (filterText||'').toLowerCase();
      let rows = keys.filter(k => {
        if (!ft) return true;
        const v = String(currentData[k] == null ? '' : currentData[k]).toLowerCase();
        return k.toLowerCase().includes(ft) || v.includes(ft);
      });
      rows.sort((a,b)=> sortAsc ? a.localeCompare(b) : b.localeCompare(a));

      tbody.innerHTML = '';
      for (const k of rows){
        const tr = document.createElement('tr');
        const tdKey = document.createElement('td'); tdKey.textContent = k;
        const tdVal = document.createElement('td'); tdVal.textContent = currentData[k] == null ? '' : String(currentData[k]);
        const tdOps = document.createElement('td'); tdOps.className = 'row-actions';

        const editBtn = document.createElement('button'); editBtn.className='edit'; editBtn.textContent='编辑';
        editBtn.addEventListener('click', ()=>{ editingKey = k; modalTitle.textContent = '编辑配置'; modalKeyInput.value = k; modalKeyInput.readOnly = true; modalKeyInput.style.background = '#f9fbff'; modalValueEl.value = currentData[k] == null ? '' : String(currentData[k]); modalError.textContent=''; editModal.style.display='flex'; modalValueEl.focus(); });

        const delBtn = document.createElement('button'); delBtn.className='del'; delBtn.textContent='删除';
        delBtn.addEventListener('click', async ()=>{ if (!confirm(`确认删除键 "${k}" ?`)) return; await performDelete(k); });

        tdOps.appendChild(editBtn); tdOps.appendChild(delBtn);
        tr.appendChild(tdKey); tr.appendChild(tdVal); tr.appendChild(tdOps);
        tbody.appendChild(tr);
      }
      if(statusEl) statusEl.textContent = `已加载 ${rows.length} / ${keys.length} 项配置`;
    }

    async function loadConfig(){ setOp(''); if(statusEl) statusEl.textContent='正在加载配置…'; try{ const res = await fetch('/api/config'); if (!res.ok) throw new Error('网络错误: '+res.status); const data = await res.json(); renderConfig(data, searchInput.value); }catch(err){ console.error(err); if(statusEl) statusEl.textContent = '加载配置失败: ' + (err && err.message ? err.message : err); tbody.innerHTML = '<tr><td colspan="3" class="empty">加载失败</td></tr>'; } }

    async function performPut(k,v){ setOp('处理中...'); try{ const res = await fetch('/api/config', { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:k,value:v}) }); if (!res.ok) throw new Error('网络错误: ' + res.status); const data = await res.json(); renderConfig(data, searchInput.value); setOp('已保存'); }catch(err){ console.error(err); setOp('保存失败: ' + (err && err.message ? err.message : err)); }finally{ setTimeout(()=>setOp(''),2000); } }

    async function performDelete(k){ setOp('处理中...'); try{ const res = await fetch('/api/config', { method:'DELETE', headers:{'Content-Type':'application/json'}, body:JSON.stringify({key:k}) }); if (!res.ok) throw new Error('网络错误: ' + res.status); const data = await res.json(); renderConfig(data, searchInput.value); setOp('已删除'); }catch(err){ console.error(err); setOp('删除失败: ' + (err && err.message ? err.message : err)); }finally{ setTimeout(()=>setOp(''),2000); } }

    // add button opens modal for adding
    addBtn.addEventListener('click', ()=>{ editingKey = null; modalTitle.textContent = '添加配置'; modalKeyInput.value=''; modalKeyInput.readOnly = false; modalKeyInput.style.background = '#fff'; modalValueEl.value=''; modalError.textContent=''; editModal.style.display='flex'; modalKeyInput.focus(); });

    // modal handlers
    modalCancel.addEventListener('click', ()=>{ editingKey = null; editModal.style.display = 'none'; });
    // validate JSON button: try to parse modalValue and show result
    modalValidate.addEventListener('click', ()=>{
      const txt = modalValueEl.value == null ? '' : modalValueEl.value.trim();
      if (!txt){ modalError.style.color = '#b91c1c'; modalError.textContent = 'Value 为空，无法验证'; return; }
      try {
        JSON.parse(txt);
        modalError.style.color = '#16a34a';
        modalError.textContent = 'JSON 格式合法';
      } catch (e) {
        modalError.style.color = '#b91c1c';
        modalError.textContent = 'JSON 解析错误: ' + (e && e.message ? e.message : '无效 JSON');
      }
    });

    modalSave.addEventListener('click', ()=>{
      const key = modalKeyInput.value && modalKeyInput.value.trim();
      const newVal = modalValueEl.value == null ? '' : modalValueEl.value;
      if (!key){ modalError.style.color = '#b91c1c'; modalError.textContent = 'Key 不能为空'; return; }
      if (!modalKeyInput.readOnly && currentData && Object.prototype.hasOwnProperty.call(currentData, key)){
        modalError.style.color = '#b91c1c'; modalError.textContent = '键已存在，请使用不同的 key 或编辑已有项';
        return;
      }
      // if the value looks like JSON, validate before saving
      const trimmed = newVal.trim();
      if (trimmed.startsWith('{') || trimmed.startsWith('[')){
        try{
          JSON.parse(trimmed);
        }catch(err){
          modalError.style.color = '#b91c1c';
          modalError.textContent = 'JSON 解析失败: ' + (err && err.message ? err.message : '无效 JSON');
          return;
        }
      }
      performPut(key, newVal);
      editingKey = null;
      editModal.style.display = 'none';
    });

    // keyboard shortcuts: Enter save, Esc close
    modalKeyInput.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') modalSave.click(); if (e.key === 'Escape') modalCancel.click(); });
    modalValueEl.addEventListener('keydown', (e)=>{ if (e.key === 'Enter') modalSave.click(); if (e.key === 'Escape') modalCancel.click(); });
    document.addEventListener('keydown', (e)=>{ if (e.key === 'Escape' && editModal.style.display === 'flex') { editingKey = null; editModal.style.display = 'none'; } });

    // search and sort
    searchInput.addEventListener('input', ()=>{ renderConfig(currentData, searchInput.value); });
    thKey.addEventListener('click', ()=>{ sortAsc = !sortAsc; thKey.textContent = `Key ${sortAsc ? '▲' : '▼'}`; renderConfig(currentData, searchInput.value); });

    // initial
    loadConfig();
  </script>
</body>
</html>
