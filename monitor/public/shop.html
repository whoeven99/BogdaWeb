<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Data</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>Shop Data for <span id="shopName"></span></h1>
  <div id="tablesContainer"></div>
  <script>
    // Support shopName from either query string (shop.html?shopName=xxx) or URL path (/shop/xxx)
    function getShopNameFromUrl() {
      const qs = new URLSearchParams(window.location.search).get('shopName');
      if (qs) return qs;
      const parts = window.location.pathname.split('/').filter(Boolean);
      // if path is like /shop/{shopName} last segment is shopName
      if (parts.length > 0) return parts[parts.length - 1];
      return '';
    }

    const shopName = getShopNameFromUrl();
    document.getElementById('shopName').textContent = shopName || 'unknown';

    if (!shopName) {
      document.getElementById('tablesContainer').innerHTML = '<p>Shop name not provided.</p>';
    } else {
      fetch(`/api/shop/${encodeURIComponent(shopName)}`)
        .then(response => response.json())
        .then(data => {
          const container = document.getElementById('tablesContainer');
          container.innerHTML = '';
          for (const [tableName, rows] of Object.entries(data)) {
            let tableHtml = `<h2>${tableName}</h2>`;
            if (Array.isArray(rows) && rows.length > 0) {
              const headers = Object.keys(rows[0]).map(key => `<th>${key}</th>`).join('');
              const rowsHtml = rows.map(row => {
                const rowHtml = Object.values(row).map(value => `<td>${value}</td>`).join('');
                return `<tr>${rowHtml}</tr>`;
              }).join('');
              tableHtml += `
                <table>
                  <thead>
                    <tr>${headers}</tr>
                  </thead>
                  <tbody>
                    ${rowsHtml}
                  </tbody>
                </table>
              `;
            } else {
              tableHtml += '<p>No data available</p>';
            }
            container.innerHTML += tableHtml;
          }
        })
        .catch(error => {
          console.error('Error fetching shop data:', error);
          document.getElementById('tablesContainer').innerHTML = '<p>Failed to load data</p>';
        });
    }
  </script>
</body>
</html>
